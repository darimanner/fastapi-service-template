name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx copier copy --defaults --vcs-ref HEAD . "$RUNNER_TEMP/render"
      - working-directory: ${{ runner.temp }}/render
        run: |
          uv sync --locked
          git init -q && git add -A
          uv run pre-commit run --all-files
          uv run pytest
          docker build .
